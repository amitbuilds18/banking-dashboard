name: Banking Dashboard CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Syntax & Integrity Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: 📦 Install Backend Dependencies
        run: npm ci

      - name: 🧪 Run Backend Syntax & Integrity Tests
        run: npm test

  frontend-ci:
    name: Frontend Build & Bundle Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 📦 Install Frontend Dependencies
        run: npm ci

      - name: 🏗️ Compile & Build Frontend Bundle (Vite)
        run: npm run build

  ci-summary:
    name: Pipeline Summary & CD Readiness
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Verify Deployment Readiness
        run: |
          echo "=========================================================="
          echo "✅ CONTINUOUS INTEGRATION (CI) PASSED SUCCESSFULLY"
          echo "----------------------------------------------------------"
          echo "• Backend: All JavaScript modules verified with 0 errors"
          echo "• Frontend: React 19 + Vite bundle generated successfully"
          echo "• Continuous Deployment: Automatic sync with Vercel Production"
          echo "=========================================================="
